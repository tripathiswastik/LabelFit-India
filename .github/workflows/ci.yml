name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          for f in server.js app.js i18n.js scripts/*.js test/*.js; do node --check "$f"; done
      - run: node --test

  python:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The tests need only these two packages; Streamlit and Pillow are for optional tools.
      - run: python -m pip install "requests>=2.32,<3" "pytest>=8,<10"
      - run: python -m pytest tests
