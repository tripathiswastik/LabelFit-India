name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy the prototype website
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check deployment configuration
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=()
          for name in GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if ((${#missing[@]})); then
            printf 'Missing GitHub Actions repository variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy website
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: labelfit-india
          source: .
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          env_vars: |-
            LABELFIT_ENABLE_ANALYSIS=false
            LABELFIT_TRUST_PROXY_HOPS=1
          flags: --allow-unauthenticated
          wait: true

      - name: Report deployed URL
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: echo "Website deployed at ${SERVICE_URL}" >> "$GITHUB_STEP_SUMMARY"
