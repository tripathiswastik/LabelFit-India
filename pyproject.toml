[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labelfit-india"
version = "0.1.0"
description = "Packaged complementary-food label inspection and evidence verification for caregivers"
readme = "README.md"
requires-python = ">=3.7"
authors = [
    { name = "Swastik Tripathi", email = "swastik.tripathi842@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "streamlit>=1.22.0",
]

